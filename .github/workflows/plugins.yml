name: Plugins

# Nivel 0 (validación estática) y nivel 1 (pruebas de scripts y hooks) de cada plugin.
# Se corre en Linux y en Windows: los devs de Polaria trabajan en Windows y varios fallos reales
# (saltos de línea, rutas con barras invertidas) solo aparecen ahí.
# Para exigirlo antes de mergear: Settings → Rules → Require status checks → "validar y probar".

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-y-probar:
    name: validar y probar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nivel 0 — validación estática de los plugins
        run: node scripts/validar-plugins.js
      - name: Nivel 1 — pruebas de scripts y hooks
        run: node scripts/correr-pruebas.js
